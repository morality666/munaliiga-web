name: Fetch league match results

on:
  # Nightly at midnight Finnish winter time (22:00 UTC; 01:00 in summer time). A run without
  # new games commits nothing and does not redeploy. Comment this out between seasons.
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  # Commits the new results to main.
  contents: write
  # Starts the deploy workflow, which a push made with GITHUB_TOKEN does not trigger.
  actions: write

concurrency:
  group: "fetch-matches"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      # Writes src/matches/matches.json and fills matchIds in the season's schedule CSV.
      # It exits 0 on an API error and leaves both files as they were.
      - name: Fetch new league games
        run: npm run fetch:matches
        working-directory: ./client

      - name: Commit results and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- client/src/matches client/notes/schedule)" ]; then
            echo "No new games."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/matches client/notes/schedule
          git commit -m "Add new league match results"
          git push
          gh workflow run deploy.yml --ref main
